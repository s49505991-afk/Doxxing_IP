<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRITICAL_OVERLOAD</title>
  <style>
    body {
      background-color: #000;
      color: #0ff;
      font-family: monospace;
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = 'te amo';
    const fontSize = 10;
    const cols = Math.floor(canvas.width / fontSize);
    const rows = Math.floor(canvas.height / fontSize);

    function overload() {
      // Bucle masivo por fotograma para saturar el hilo de ejecución
      for (let j = 0; j < 50; j++) {
        for (let i = 0; i < 500; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          const x = Math.floor(Math.random() * cols) * fontSize;
          const y = Math.floor(Math.random() * rows) * fontSize;
          
          ctx.fillStyle = Math.random() > 0.5 ? '#ff0000' : (Math.random() > 0.5 ? '#00ff00' : '#ffffff');
          ctx.font = fontSize + 'px monospace';
          ctx.fillText(text, x, y);
        }
      }
      requestAnimationFrame(overload);
    }

    requestAnimationFrame(overload);
  </script>
</body>
</html>
